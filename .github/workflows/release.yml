name: Release

# Tag-driven publish of the self-host image to GHCR for amd64 and arm64.
# Nothing is tagged unless verify and smoke pass: build needs both, and merge
# is the only job that creates tags. If one architecture's push fails after the
# other succeeded, an untagged digest stays in GHCR but no tag points at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/weeeha/jobsmith

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by version tag, the style of ci.yml and image.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag commit is on main
        run: |
          set -eu
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: The tag matches package.json, cli/package.json and cli/src/version.ts
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  smoke:
    uses: ./.github/workflows/image.yml

  build:
    needs: [verify, smoke]
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/weeeha/jobsmith,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Write the digest to a file
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: release-tags.mjs reads the existing release tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list with the release tags
        run: |
          set -eu
          args=""
          for t in $(node scripts/release-tags.mjs "$GITHUB_REF_NAME"); do
            args="$args -t $IMAGE:$t"
          done
          refs=""
          for d in "$RUNNER_TEMP"/digests/*; do
            refs="$refs $IMAGE@sha256:$(basename "$d")"
          done
          echo "tags:$args"
          # shellcheck disable=SC2086
          docker buildx imagetools create $args $refs

      - name: Inspect the result
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  release:
    needs: [merge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli:build

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/notes.md"
          flag=""
          case "$version" in
            *-*) flag="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" cli/dist/jobsmith.mjs \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $flag
